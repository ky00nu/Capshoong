<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지워 · 앱 클리너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F7F6F4; --surface:#FFFFFF; --surface-2:#F0EEEB;
    --ink:#1A1614; --muted:#6B6560; --line:#E6E2DD;
    --accent:#EB4448; --accent-ink:#FFFFFF; --accent-soft:rgba(235,68,72,0.10);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px 64px}
  h1,h2,h3{font-family:'Gothic A1','Noto Sans KR',sans-serif;letter-spacing:-.01em}

  /* 헤더 */
  .header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .header .logo{width:44px;height:44px;border-radius:12px;display:block;
                box-shadow:0 4px 12px -4px rgba(235,68,72,.4)}
  .header h1{font-size:22px;font-weight:800}
  .header p{color:var(--muted);font-size:13.5px;margin-top:2px}

  .searchbar{margin:22px 0 18px}
  .searchbar input{width:100%;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:13px 16px;font-size:14px;color:var(--ink);outline:none;
    transition:border-color .15s}
  .searchbar input:focus{border-color:var(--accent)}

  /* 앱 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .app{background:var(--surface);border:1px solid var(--line);border-radius:14px;
       padding:16px 14px;text-align:center;cursor:pointer;transition:border-color .12s,transform .08s;
       display:flex;flex-direction:column;align-items:center;gap:10px}
  .app:hover{border-color:var(--accent);transform:translateY(-2px)}
  .app .ic{width:56px;height:56px;border-radius:12px;background:var(--surface-2);
           display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
  .app .ic img{width:56px;height:56px;object-fit:contain;display:block}
  .app .ic .fallback{font-family:'Gothic A1';font-weight:800;font-size:22px;color:var(--muted)}
  .app .nm{font-size:13px;font-weight:600;line-height:1.3;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .app .ver{font-size:11px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0}

  /* 상세 */
  .detail{display:none}
  .detail.on{display:block}
  .back{background:none;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;
        padding:6px 0;margin-bottom:6px;font-weight:600}
  .back:hover{color:var(--accent)}
  .dhead{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
  .dhead .ic{width:60px;height:60px;border-radius:14px;background:var(--surface-2);
             display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
  .dhead .ic img{width:60px;height:60px;object-fit:contain}
  .dhead .nm{font-size:20px;font-weight:800}
  .dhead .sub{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-all}

  .summary{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin:16px 0 12px;font-size:14px}
  .summary .cnt{font-weight:700}
  .summary .sz{font-family:'Gothic A1';font-weight:800;color:var(--accent);font-size:17px}

  .items{list-style:none;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .item input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
  .item .meta{flex:1;min-width:0}
  .item .p{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .k{font-size:11.5px;color:var(--muted);margin-top:2px}
  .item .kind{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border-radius:999px;padding:2px 9px;flex:0 0 auto}
  .item .sz{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .item.app-body{border-color:var(--accent);background:#fff}

  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  button.btn{cursor:pointer;border:none;border-radius:12px;font-size:15px;font-weight:700;
    font-family:'Gothic A1',sans-serif;padding:14px 24px;transition:background .15s,transform .08s}
  button.btn:active{transform:scale(.98)}
  .btn-danger{background:var(--accent);color:#fff}
  .btn-danger:hover{background:#D63B3F}
  .btn-ghost{background:var(--surface-2);color:var(--ink)}
  .btn-ghost:hover{background:var(--line)}
  .selall{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .selall input{width:16px;height:16px;accent-color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  .toast.on{opacity:1}
  .spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{color:var(--muted);font-size:14px;text-align:center;padding:40px 0;display:flex;
    align-items:center;justify-content:center;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img class="logo" src="icon.png" alt="지워" onerror="this.style.display='none'">
    <div>
      <h1>지워</h1>
      <p>앱과 연관된 시스템 파일까지 한 번에 정리</p>
    </div>
  </div>

  <!-- 목록 뷰 -->
  <div id="view-list">
    <div class="searchbar"><input id="q" type="text" placeholder="앱 검색…" autocomplete="off"></div>
    <div id="grid" class="grid"></div>
    <div id="list-loading" class="loading"><span class="spinner"></span> 설치된 앱을 불러오는 중…</div>
    <div id="list-empty" class="empty" style="display:none">삭제 가능한 앱을 찾지 못했어요.<br>(macOS 기본 앱은 목록에서 제외됩니다)</div>
  </div>

  <!-- 상세 뷰 -->
  <div id="view-detail" class="detail">
    <button class="back" id="back">← 앱 목록</button>
    <div class="dhead">
      <div class="ic" id="d-ic"></div>
      <div>
        <div class="nm" id="d-nm"></div>
        <div class="sub" id="d-sub"></div>
      </div>
    </div>

    <div id="scan-loading" class="loading"><span class="spinner"></span> 연관 파일을 검색하는 중…</div>

    <div id="scan-result" style="display:none">
      <div class="summary">
        <div><span class="cnt" id="s-cnt">0</span>개 항목 선택됨</div>
        <div class="sz" id="s-size">0 B</div>
      </div>
      <label class="selall"><input type="checkbox" id="selall" checked> 전체 선택</label>
      <ul class="items" id="items" style="margin-top:10px"></ul>
      <div class="actions">
        <button class="btn btn-danger" id="do-trash">휴지통으로 삭제</button>
        <button class="btn btn-ghost" id="cancel">취소</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let APPS = [], CUR = null, ITEMS = [];

function fmtSize(b){
  if(b < 1024) return b + ' B';
  const u = ['KB','MB','GB','TB']; let i=-1, n=b;
  do{ n/=1024; i++; }while(n>=1024 && i<u.length-1);
  return n.toFixed(n<10?1:0) + ' ' + u[i];
}
function toast(msg, ms=2600){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms);
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadApps(){
  try{
    const r = await fetch('/api/apps'); const j = await r.json();
    APPS = j.apps || [];
  }catch(e){ APPS=[]; }
  $('#list-loading').style.display='none';
  renderGrid('');
}

function renderGrid(q){
  const grid = $('#grid'); grid.innerHTML='';
  const ql = q.trim().toLowerCase();
  const list = APPS.filter(a => !ql || a.name.toLowerCase().includes(ql));
  $('#list-empty').style.display = (APPS.length===0) ? 'block' : 'none';
  list.forEach(a=>{
    const el = document.createElement('div');
    el.className='app';
    const letter = esc((a.name||'?').trim().charAt(0).toUpperCase());
    el.innerHTML = `<div class="ic"><span class="fallback">${letter}</span></div>
      <div class="nm">${esc(a.name)}</div>
      <div class="ver">${a.version?('v'+esc(a.version)):''}</div>`;
    // lazy icon
    const img = new Image();
    img.onload = ()=>{ const ic=el.querySelector('.ic'); ic.innerHTML=''; ic.appendChild(img); };
    img.src = '/api/icon?path=' + encodeURIComponent(a.path);
    el.onclick = ()=> openApp(a);
    grid.appendChild(el);
  });
}

async function openApp(a){
  CUR = a;
  $('#view-list').style.display='none';
  $('#view-detail').classList.add('on');
  $('#scan-result').style.display='none';
  $('#scan-loading').style.display='flex';
  $('#d-nm').textContent = a.name;
  $('#d-sub').textContent = a.bundle_id || a.path;
  const ic = $('#d-ic'); ic.innerHTML='';
  const img=new Image(); img.onload=()=>{ic.innerHTML='';ic.appendChild(img);};
  img.src='/api/icon?path='+encodeURIComponent(a.path); ic.appendChild(img);
  try{
    const r = await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:a.path})});
    const j = await r.json();
    if(j.error){ toast(j.error); backToList(); return; }
    ITEMS = j.items || [];
    renderItems();
  }catch(e){ toast('스캔 실패'); backToList(); }
}

function renderItems(){
  $('#scan-loading').style.display='none';
  $('#scan-result').style.display='block';
  const ul = $('#items'); ul.innerHTML='';
  ITEMS.forEach((it,idx)=>{
    const li=document.createElement('li');
    li.className='item'+(it.kind==='앱 본체'?' app-body':'');
    const fname = it.path.split('/').pop();
    li.innerHTML = `<input type="checkbox" data-i="${idx}" checked>
      <div class="meta"><div class="p">${esc(fname)}</div><div class="k">${esc(it.path)}</div></div>
      <span class="kind">${esc(it.kind)}</span>
      <span class="sz">${fmtSize(it.size)}</span>`;
    li.querySelector('input').onchange = updateSummary;
    ul.appendChild(li);
  });
  updateSummary();
}

function checkedIdx(){
  return [...document.querySelectorAll('#items input:checked')].map(c=>+c.dataset.i);
}
function updateSummary(){
  const idx = checkedIdx();
  const total = idx.reduce((s,i)=>s+ITEMS[i].size,0);
  $('#s-cnt').textContent = idx.length;
  $('#s-size').textContent = fmtSize(total);
  const all = $('#selall');
  all.checked = idx.length===ITEMS.length && ITEMS.length>0;
  all.indeterminate = idx.length>0 && idx.length<ITEMS.length;
}

function backToList(){
  $('#view-detail').classList.remove('on');
  $('#view-list').style.display='block';
}

async function doTrash(){
  const idx = checkedIdx();
  if(idx.length===0){ toast('선택된 항목이 없어요.'); return; }
  const paths = idx.map(i=>ITEMS[i].path);
  const freed = idx.reduce((s,i)=>s+ITEMS[i].size,0);
  const btn=$('#do-trash'); btn.disabled=true; btn.textContent='삭제 중…';
  try{
    const r = await fetch('/api/trash',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({paths})});
    const j = await r.json();
    let okN=(j.trashed||[]).length, failN=(j.failed||[]).length;
    if(failN && j.needs_auth){
      const failedPaths=(j.failed||[]).map(f=>f.path);
      if(confirm(`${failN}개 항목은 관리자 권한이 필요해요 (예: root 소유로 설치된 앱).\n관리자 암호를 입력해 삭제할까요? (휴지통으로 이동 — 복구 가능)`)){
        btn.textContent='관리자 권한으로 삭제 중…';
        try{
          const r2=await fetch('/api/trash-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths:failedPaths})});
          const j2=await r2.json();
          okN += (j2.trashed||[]).length; failN=(j2.failed||[]).length;
        }catch(e2){ /* keep failN */ }
      }
    }
    if(failN){
      toast(`${okN}개 휴지통 이동 · ${failN}개 실패`, 4200);
    }else{
      toast(`✓ ${okN}개 항목(${fmtSize(freed)})을 휴지통으로 옮겼어요`, 3600);
    }
  }catch(e){ toast('삭제 중 오류'); }
  btn.disabled=false; btn.textContent='휴지통으로 삭제';
  // 목록 갱신
  await loadApps(); backToList();
}

$('#q').addEventListener('input', e=>renderGrid(e.target.value));
$('#back').onclick = backToList;
$('#cancel').onclick = backToList;
$('#do-trash').onclick = doTrash;
$('#selall').onchange = e=>{
  document.querySelectorAll('#items input[data-i]').forEach(c=>c.checked=e.target.checked);
  updateSummary();
};
loadApps();
</script>
</body>
</html>
