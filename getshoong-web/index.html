<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube 다운로더</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F4; --surface: #FFFFFF; --surface-2: #F0EEEB;
      --ink: #1A1614; --muted: #6B6560; --line: #E6E2DD;
      --accent: #EB4448; --accent-ink: #FFFFFF;
      --ok: #1DB954; --ok-hover: #17A848;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .container { width: 100%; max-width: 680px; }

    .header { text-align: center; margin-bottom: 40px; }

    .header .logo {
      width: 52px; height: 52px;
      background: var(--accent);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px -4px rgba(235,68,72,0.5);
    }
    .header .logo svg { width: 28px; height: 28px; fill: white; }

    .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { color: var(--muted); margin-top: 6px; font-size: 14px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px -20px rgba(26,22,20,0.25);
    }

    .input-row { display: flex; gap: 10px; }
    .input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .input-row input:focus { border-color: var(--accent); }
    .input-row input::placeholder { color: #A99F97; }

    button {
      cursor: pointer; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; padding: 13px 22px;
      transition: opacity .15s, transform .1s, background .15s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover:not(:disabled) { background: #D63B3F; }

    .btn-download {
      width: 100%;
      background: var(--ok);
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 16px;
    }
    .btn-download:hover:not(:disabled) { background: var(--ok-hover); }

    /* Video Info */
    .video-info { display: none; gap: 16px; align-items: flex-start; }
    .video-info.visible { display: flex; }
    .video-info img {
      width: 120px; height: 68px; object-fit: cover;
      border-radius: 8px; flex-shrink: 0; background: var(--surface-2);
    }
    .video-meta { flex: 1; min-width: 0; }
    .video-meta .title {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .video-meta .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Quality selector */
    .quality-section { margin-top: 20px; display: none; }
    .quality-section.visible { display: block; }
    .quality-section label {
      display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px;
    }
    .quality-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .quality-btn {
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500;
      transition: all .15s;
    }
    .quality-btn:hover { border-color: var(--accent); color: var(--accent); }
    .quality-btn.selected { background: var(--accent); border-color: var(--accent); color: white; }

    /* Progress */
    .progress-section { display: none; margin-top: 20px; }
    .progress-section.visible { display: block; }
    .progress-bar-bg { background: var(--surface-2); border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #FF6B6B);
      border-radius: 99px; transition: width .3s ease; width: 0%;
    }
    .progress-label {
      font-size: 12px; color: var(--muted); margin-top: 8px;
      display: flex; justify-content: space-between;
    }

    /* Done state */
    .done-section {
      display: none; margin-top: 20px; padding: 16px;
      background: #EAF7EE;
      border: 1px solid rgba(29,185,84,0.35);
      border-radius: 10px; text-align: center;
    }
    .done-section.visible { display: block; }
    .done-section .checkmark { font-size: 28px; margin-bottom: 8px; }
    .done-section p { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

    .btn-dl-file {
      background: var(--ok); color: white;
      padding: 10px 24px; border-radius: 8px;
      font-size: 14px; font-weight: 600;
      display: inline-block; text-decoration: none;
      transition: background .15s;
    }
    .btn-dl-file:hover { background: var(--ok-hover); }

    /* Error */
    .error-msg {
      display: none; margin-top: 12px; padding: 12px 14px;
      background: #FDECEC;
      border: 1px solid rgba(235,68,72,0.35);
      border-radius: 8px; font-size: 13px; color: #C0392B;
    }
    .error-msg.visible { display: block; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .folder-note { font-size: 12px; color: #A99F97; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
<script>
/* 접근 코드(지인 공유용) 처리: 서버가 401 need_code면 코드 물어보고 저장 후 재시도 */
(function(){
  const orig = window.fetch.bind(window);
  const get = ()=>{ try{return localStorage.getItem('gs_code')||''}catch(e){return ''} };
  window.fetch = async (url, opt={})=>{
    opt = opt || {};
    opt.headers = Object.assign({}, opt.headers||{}, {'X-Access-Code': get()});
    let res = await orig(url, opt);
    if(res.status===401){
      let j={}; try{ j = await res.clone().json(); }catch(e){}
      if(j && j.need_code){
        const c = prompt('접근 코드를 입력하세요 (관리자에게 문의)');
        if(c){ try{localStorage.setItem('gs_code', c.trim())}catch(e){}
          opt.headers['X-Access-Code'] = c.trim();
          res = await orig(url, opt);
        }
      }
    }
    return res;
  };
})();
</script>

    </div>
    <h1>겟슝 YouTube 다운로더</h1>
    <p>유튜브 동영상을 MP4로 다운로드하세요</p>
  </div>

  <div class="card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
      <button class="btn-primary" id="fetchBtn" onclick="fetchInfo()">정보 가져오기</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Video Info -->
    <div class="video-info" id="videoInfo" style="margin-top:20px;">
      <img id="thumbnail" src="" alt="thumbnail" />
      <div class="video-meta">
        <div class="title" id="videoTitle"></div>
        <div class="sub" id="videoSub"></div>
      </div>
    </div>

    <!-- Quality -->
    <div class="quality-section" id="qualitySection">
      <label>화질 선택</label>
      <div class="quality-grid" id="qualityGrid"></div>
      <button class="btn-download" id="downloadBtn" onclick="startDownload()" disabled>
        다운로드 시작
      </button>
    </div>

    <!-- Progress -->
    <div class="progress-section" id="progressSection">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-label">
        <span id="progressStatus">다운로드 중...</span>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <!-- Done -->
    <div class="done-section" id="doneSection">
      <div class="checkmark">✅</div>
      <p>다운로드 완료! 아래 버튼을 눌러 파일을 저장하세요.</p>
      <a id="downloadLink" href="#" class="btn-dl-file">💾 파일 저장</a>
      <button class="btn-dl-file" style="background:#444;margin-left:8px;" onclick="openFolder()">📂 폴더 열기</button>
    </div>
  </div>

  <div class="folder-note" id="folderNote"></div>
</div>

<script>
  const BASE = 'http://localhost:7777';
  let selectedFormat = '';
  let selectedLabel = '';
  let currentJobId = null;
  let pollTimer = null;
  let currentTitle = '';

  async function fetchInfo() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return showError('YouTube URL을 입력해주세요.');

    resetUI();
    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>분석 중...';

    try {
      const res = await fetch(`${BASE}/api/info`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (data.error) { showError(data.error); return; }

      currentTitle = data.title;
      document.getElementById('thumbnail').src = data.thumbnail;
      document.getElementById('videoTitle').textContent = data.title;
      document.getElementById('videoSub').textContent =
        `${data.uploader}  •  ${formatDuration(data.duration)}`;

      document.getElementById('videoInfo').classList.add('visible');

      // Build quality buttons
      const grid = document.getElementById('qualityGrid');
      grid.innerHTML = '';
      data.qualities.forEach((q, i) => {
        const b = document.createElement('button');
        b.className = 'quality-btn' + (i === 0 ? ' selected' : '');
        b.textContent = q.label;
        b.onclick = () => selectQuality(b, q.value, q.label);
        grid.appendChild(b);
        if (i === 0) { selectedFormat = q.value; selectedLabel = q.label; }
      });

      document.getElementById('qualitySection').classList.add('visible');
      document.getElementById('downloadBtn').disabled = false;
    } catch (e) {
      showError('서버에 연결할 수 없습니다. 서버가 실행 중인지 확인하세요.');
    } finally {
      btn.disabled = false;
      btn.textContent = '정보 가져오기';
    }
  }

  function selectQuality(btn, fmt, label) {
    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedFormat = fmt;
    selectedLabel = label;
  }

  async function startDownload() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url || !selectedFormat) return;

    const dlBtn = document.getElementById('downloadBtn');
    dlBtn.disabled = true;
    dlBtn.innerHTML = '<span class="spinner"></span>요청 중...';

    document.getElementById('progressSection').classList.add('visible');
    document.getElementById('doneSection').classList.remove('visible');
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressPct').textContent = '0%';
    document.getElementById('progressStatus').textContent = '다운로드 준비 중...';

    try {
      const res = await fetch(`${BASE}/api/download`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, format: selectedFormat, title: currentTitle }),
      });
      const data = await res.json();
      if (data.error) { showError(data.error); return; }

      currentJobId = data.job_id;
      pollTimer = setInterval(pollStatus, 800);
    } catch (e) {
      showError('다운로드를 시작할 수 없습니다.');
      dlBtn.disabled = false;
      dlBtn.textContent = '다운로드 시작';
    }
  }

  async function pollStatus() {
    if (!currentJobId) return;
    try {
      const res = await fetch(`${BASE}/api/status/${currentJobId}`);
      const job = await res.json();

      const pct = Math.round(job.progress || 0);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressPct').textContent = pct + '%';

      if (job.status === 'downloading') {
        document.getElementById('progressStatus').textContent = `다운로드 중... (${selectedLabel})`;
      } else if (job.status === 'converting') {
        document.getElementById('progressStatus').textContent = `H.264 변환 중... 잠시만 기다려주세요`;
        document.getElementById('progressFill').style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
      } else if (job.status === 'done') {
        clearInterval(pollTimer);
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressPct').textContent = '100%';
        document.getElementById('progressStatus').textContent = '완료!';
        showDone(job.filename);
      } else if (job.status === 'error') {
        clearInterval(pollTimer);
        showError('다운로드 실패: ' + job.error);
        resetDownloadBtn();
      }
    } catch (e) { /* ignore transient */ }
  }

  function showDone(filename) {
    const done = document.getElementById('doneSection');
    const link = document.getElementById('downloadLink');
    link.href = `${BASE}/api/file/${currentJobId}`;
    link.download = filename;
    done.classList.add('visible');
    document.getElementById('folderNote').textContent =
      `저장 위치: yt-downloader/downloads/${filename}`;
    resetDownloadBtn();
  }

  function resetDownloadBtn() {
    const btn = document.getElementById('downloadBtn');
    btn.disabled = false;
    btn.textContent = '다시 다운로드';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function resetUI() {
    document.getElementById('errorMsg').classList.remove('visible');
    document.getElementById('videoInfo').classList.remove('visible');
    document.getElementById('qualitySection').classList.remove('visible');
    document.getElementById('progressSection').classList.remove('visible');
    document.getElementById('doneSection').classList.remove('visible');
    document.getElementById('folderNote').textContent = '';
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    currentJobId = null;
  }

  function formatDuration(sec) {
    if (!sec) return '';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function openFolder() {
    fetch(`${BASE}/api/open-folder`, { method: 'POST' });
  }

  // Allow Enter key in URL input
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchInfo();
  });
</script>
</body>
</html>
